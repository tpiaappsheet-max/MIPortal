<div class="h-full flex flex-col p-4 sm:p-6 bg-slate-50 custom-scrollbar overflow-y-auto">
    <div class="max-w-xl mx-auto w-full animate-fade-in mt-4">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="bg-slate-900 p-6 sm:p-8 text-white relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl"></div>
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="p-2 bg-white/10 rounded-xl">
                            <i data-lucide="shield-check" class="w-6 h-6 text-blue-400"></i>
                        </div>
                        <h2 class="text-xl font-black tracking-tight">Account Security</h2>
                    </div>
                    <p class="text-xs text-slate-400 font-medium">Update your portal username and password. You will be required to log in again after saving.</p>
                </div>
            </div>

            <div class="p-6 sm:p-8">
                <form id="credential-form" onsubmit="handleCredentialChange(event)" class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1.5 ml-1">New Username</label>
                        <div class="relative">
                            <i data-lucide="at-sign" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                            <input type="text" id="sec-username" required class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Choose a new username">
                        </div>
                    </div>

                    <div class="pt-2">
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1.5 ml-1">Current Password <span class="text-rose-500">*</span></label>
                        <input type="password" id="sec-old-pass" required class="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-blue-500 mb-4" placeholder="Verify your current password">
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black uppercase text-slate-500 mb-1.5 ml-1">New Password</label>
                                <input type="password" id="sec-new-pass" required minlength="6" class="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Minimum 6 characters">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black uppercase text-slate-500 mb-1.5 ml-1">Confirm New Password</label>
                                <input type="password" id="sec-confirm-pass" required class="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm font-bold text-slate-800 outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Must match new password">
                            </div>
                        </div>
                    </div>

                    <div id="sec-error-msg" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-xs font-bold flex items-start gap-2">
                        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                        <span id="sec-error-text"></span>
                    </div>

                    <div class="pt-4 border-t border-slate-100 flex items-center justify-end">
                        <button type="submit" id="sec-submit-btn" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black uppercase tracking-wider rounded-xl shadow-md transition flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> Save Credentials
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById("sec-username").value = currentMiUser.username;

    function showSecError(msg) {
        document.getElementById("sec-error-text").innerText = msg;
        document.getElementById("sec-error-msg").classList.remove("hidden");
    }

    async function handleCredentialChange(e) {
        e.preventDefault();
        document.getElementById("sec-error-msg").classList.add("hidden");

        const newUsername = document.getElementById("sec-username").value.trim();
        const oldPass = document.getElementById("sec-old-pass").value.trim();
        const newPass = document.getElementById("sec-new-pass").value.trim();
        const confirmPass = document.getElementById("sec-confirm-pass").value.trim();

        if (newPass !== confirmPass) return showSecError("New passwords do not match.");

        const btn = document.getElementById("sec-submit-btn");
        const originalBtnHtml = btn.innerHTML;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Saving...`;
        btn.disabled = true;

        const payload = {
            action: "updateInspectorCredentials",
            inspectorId: currentMiUser.inspectorId,
            oldPassword: oldPass,
            newUsername: newUsername,
            newPassword: newPass,
            client: currentMiUser.client
        };

        try {
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
            const data = await res.json();

            if (data.status) {
                alert(data.message);
                if (typeof miLogout === 'function') miLogout();
                else window.location.reload();
            } else {
                showSecError(data.message || "Failed to update credentials.");
                btn.innerHTML = originalBtnHtml; btn.disabled = false;
                lucide.createIcons();
            }
        } catch (err) {
            showSecError("Network error occurred.");
            btn.innerHTML = originalBtnHtml; btn.disabled = false;
            lucide.createIcons();
        }
    }
</script>
